<div class="admin-layout" *ngIf="auth.isLoggedIn()">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Tix<i>ify</i> Admin</h2>
      <span class="user-role">{{ auth.currentUser()?.role || 'ADMIN' }}</span>
    </div>

    <nav class="nav-links">
      <a routerLink="/dashboard" routerLinkActive="active">Kennzahlen</a>
      <a routerLink="/events" routerLinkActive="active">Events & Kontingente</a>
      <a routerLink="/users" routerLinkActive="active">Benutzer</a>
      <a routerLink="/checkin" routerLinkActive="active">Einlasskontrolle</a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <b>{{ auth.currentUser()?.name || 'Administrator' }}</b>
        <small>{{ auth.currentUser()?.email || 'Keine E-Mail hinterlegt' }}</small>
      </div>
      <button class="btn-logout" (click)="onLogout()">Abmelden</button>
      <a href="http://localhost:3000" class="btn-shop-link">← Zum Kunden-Shop</a>
    </div>
  </aside>

  <main class="content-area">
    <router-outlet></router-outlet>
  </main>
</div>

<div class="auth-layout" *ngIf="!auth.isLoggedIn()">
  <router-outlet></router-outlet>
</div>
