<div class="page-container">
  <header class="page-header">
    <h1>Einlasskontrolle (Ticket Check-in)</h1>
    <p>Atomare Entwertung über das Backend zur Vermeidung von Doppel-Scans</p>
  </header>

  <div class="checkin-box">
    <form (ngSubmit)="onCheckIn()">
      <label for="code">Ticket-Code</label>
      <div class="input-row">
        <input 
          id="code" 
          type="text" 
          [(ngModel)]="ticketCode" 
          name="ticketCode" 
          placeholder="z. B. TIX-9C9FEB3D" 
          autocomplete="off"
          required
        >
        <button type="submit" [disabled]="isLoading" class="btn-scan">
          {{ isLoading ? 'Prüfe...' : 'Entwerten' }}
        </button>
      </div>
    </form>

    <div *ngIf="resultStatus === 'valid'" class="status-box status-valid">
      ✓ {{ statusMessage }}
    </div>

    <div *ngIf="resultStatus === 'used'" class="status-box status-used">
      ⚠ {{ statusMessage }}
    </div>

    <div *ngIf="resultStatus === 'invalid'" class="status-box status-invalid">
      ✕ {{ statusMessage }}
    </div>
  </div>
</div>
